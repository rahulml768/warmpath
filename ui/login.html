<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WarmPath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --canvas:#efeae2; --ink:#0D0D0D; --soft:#72727E; --line:#E8E8EC; --bad:#b91c1c }
  * { box-sizing: border-box }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--canvas);
         font: 14px/1.5 "Plus Jakarta Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif; color: var(--ink); padding: 0 16px }
  .box { width: 100%; max-width: 380px; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 28px }
  .team { display: flex; gap: 6px; margin-bottom: 18px }
  .team img { width: 36px; height: 36px; border-radius: 10px; object-fit: cover }
  h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.4px }
  p { margin: 6px 0 18px; color: var(--soft) }
  input { width: 100%; border: 1.5px solid #e4ddd2; border-radius: 12px; padding: 11px 14px; font: 15px inherit; font-family: inherit; outline: none }
  input:focus { border-color: var(--ink) }
  button { margin-top: 12px; width: 100%; border: 0; border-radius: 12px; padding: 11px; background: var(--ink); color: #fff; font: 600 14px inherit; font-family: inherit; cursor: pointer }
  .err { color: var(--bad); font-size: 13px; margin-top: 10px; min-height: 1em }
</style>
</head>
<body>
  <form class="box" method="post" action="/login">
    <div class="team"><img src="agents/alex.webp" alt=""><img src="agents/quinn.webp" alt=""><img src="agents/jordan.webp" alt=""><img src="agents/casey.webp" alt=""><img src="agents/morgan.webp" alt=""></div>
    <h1>WarmPath</h1>
    <p>This console can email people and post on LinkedIn, so it asks for the access key.</p>
    <input name="key" type="password" placeholder="Access key" autocomplete="current-password" autofocus required>
    <button type="submit">Open the console</button>
    <div class="err">{{error}}</div>
  </form>
</body>
</html>
